# Full local/production stack. `docker compose up` brings up Postgres, Redis, the
# dashboard, and the scan worker (the worker image ships Foundry for the real
# fork-based council). Set secrets in a .env next to this file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redline}
      POSTGRES_DB: redline
    volumes: [redline_pg:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U redline']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      DATABASE_URL: postgresql://redline:${POSTGRES_PASSWORD:-redline}@postgres:5432/redline
      REDIS_URL: redis://redis:6379
      OG_ROUTER_API_KEY: ${OG_ROUTER_API_KEY:-}
      ARCHIVE_RPC_URLS: ${ARCHIVE_RPC_URLS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      REDLINE_ADMIN_TOKEN: ${REDLINE_ADMIN_TOKEN:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      DATABASE_URL: postgresql://redline:${POSTGRES_PASSWORD:-redline}@postgres:5432/redline
      REDIS_URL: redis://redis:6379
      OG_ROUTER_API_KEY: ${OG_ROUTER_API_KEY:-}
      ARCHIVE_RPC_URLS: ${ARCHIVE_RPC_URLS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  redline_pg:
