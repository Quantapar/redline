name: Docker

on:
  push:
    branches: [main]
    paths: ['docker/**', 'docker-compose.yml', 'packages/**', 'apps/**', 'pnpm-lock.yaml']
  pull_request:
    paths: ['docker/**', 'docker-compose.yml']

# Build the images so the Dockerfiles can't rot. No push — just validate they build.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, worker, github-app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
