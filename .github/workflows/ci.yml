name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redline
          POSTGRES_PASSWORD: redline
          POSTGRES_DB: redline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://redline:redline@localhost:5432/redline_test
      TEST_DATABASE_URL: postgresql://redline:redline@localhost:5432/redline_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Foundry (so the execution-level referee tests actually run)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Push database schema
        run: pnpm --filter @redline/db push
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r --workspace-concurrency=1 test
      - name: Build web (catch production-build regressions typecheck misses)
        run: pnpm --filter @redline/web build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
